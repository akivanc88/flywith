name: Poll fares

# Daily LetsFG fare poll for YYZ → BOM and every stopover leg. Searches are spaced
# 200s apart to stay within the free tier (~3 searches / 10 min), so a run takes ~30 min.
# The snapshot is uploaded as an artifact; point the agent at it with FLYWITH_FARE_SNAPSHOT.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Departure date (YYYY-MM-DD); defaults to 30 days out"
        required: false

permissions:
  contents: read

concurrency:
  group: poll-fares
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    if: ${{ github.repository_owner == 'akivanc88' }}
    defaults:
      run:
        working-directory: agent

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent/package-lock.json

      - name: Install pinned dependencies
        run: npm ci

      - name: Poll LetsFG
        env:
          LETSFG_API_KEY: ${{ secrets.LETSFG_API_KEY }}
          POLL_DATE: ${{ inputs.date }}
        run: |
          if [ -z "$LETSFG_API_KEY" ]; then echo "LETSFG_API_KEY secret is not set; skipping."; exit 0; fi
          npm run poll-fares -- ${POLL_DATE:+--date "$POLL_DATE"} --out data/fares-latest.json

      - name: Upload fare snapshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fares-latest
          path: agent/data/fares-latest.json
          if-no-files-found: ignore
          retention-days: 14
